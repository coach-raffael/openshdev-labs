services:
  db:
    image: quay.io/sclorg/postgresql-16-c9s
    environment:
      POSTGRES_USER: shortly
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: shortly
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    image: localhost/shortly:3.0
    ports:
      - 8080:8080
    environment:
      DATABASE_URL: postgresql://shortly:secret@localhost:5432/shortly
volumes:
  pgdata:
