services:

  db:
    image: quay.io/sclorg/postgresql-16-c9s:latest
    environment:
      POSTGRESQL_USER: shortly
      POSTGRESQL_DATABASE: shortly
      POSTGRESQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/pgsql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "shortly"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .                                  # Containerfile in this directory
    image: localhost/shortly:3.0              # name for the built image
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://shortly:${DB_PASSWORD}@db:5432/shortly
      APP_NAME: shortly-compose
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
