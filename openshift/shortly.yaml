apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortly
  labels: { app: shortly }
spec:
  replicas: 2
  selector:
    matchLabels: { app: shortly }
  template:
    metadata:
      labels: { app: shortly }
    spec:
      containers:
      - name: shortly
        image: quay.io/YOURUSER/shortly:3.0
        ports:
        - containerPort: 8080
        env:
        - name: APP_NAME
          value: shortly-openshift
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef: { name: shortly-db-url, key: DATABASE_URL }
        readinessProbe:
          httpGet: { path: /health, port: 8080 }
          periodSeconds: 5
        livenessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits:   { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: shortly
spec:
  selector: { app: shortly }
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: shortly
spec:
  to: { kind: Service, name: shortly }
  port: { targetPort: 8080 }
  tls: { termination: edge }
