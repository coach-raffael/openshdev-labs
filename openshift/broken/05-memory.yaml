apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken05
  labels: { app: broken05 }
spec:
  replicas: 1
  selector:
    matchLabels: { app: broken05 }
  template:
    metadata:
      labels: { app: broken05 }
    spec:
      containers:
      - name: shortly
        image: quay.io/coach-raffael/shortly:3.0
        ports:
        - containerPort: 8080
        env:
        - name: APP_NAME
          value: broken05
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef: { name: shortly-db-url, key: DATABASE_URL }
        resources:
          requests: { cpu: 50m, memory: 32Mi }
          limits:   { cpu: 500m, memory: 32Mi }
