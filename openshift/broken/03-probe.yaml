apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken03
  labels: { app: broken03 }
spec:
  replicas: 1
  selector:
    matchLabels: { app: broken03 }
  template:
    metadata:
      labels: { app: broken03 }
    spec:
      containers:
      - name: shortly
        image: quay.io/coach-raffael/shortly:3.0
        ports:
        - containerPort: 8080
        env:
        - name: APP_NAME
          value: broken03
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef: { name: shortly-db-url, key: DATABASE_URL }
        readinessProbe:
          httpGet: { path: /healthz, port: 8080 }
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: broken03
  labels: { app: broken03 }
spec:
  selector: { app: broken03 }
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: broken03
  labels: { app: broken03 }
spec:
  to: { kind: Service, name: broken03 }
  port: { targetPort: 8080 }
  tls: { termination: edge }
